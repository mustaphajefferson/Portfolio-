<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio spirale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : scène 3D plein écran ; interface fixée aux quatre coins + centre haut ; menu qui naît du bouton */
/* Deux couleurs : crème #f8f3e3 et charbon (noir à 85 % sur la crème = #252422). Les projets portent la couleur. */
:root{
  --cream:#f8f3e3;
  --coal:#252422;
  --bg:var(--cream);
  --fg:var(--coal);
  --dim:rgba(0,0,0,.32);
  --line:rgba(0,0,0,.055);
  --pill:var(--coal);
  --ink:var(--cream);
  --ink-dim:rgba(248,243,227,.55);
  --veil:rgba(248,243,227,.55);
  --soft:rgba(248,243,227,.08);
  --soft-strong:rgba(248,243,227,.22);
  --rule:rgba(248,243,227,.14);
  --shadow:rgba(37,36,34,.18);
  --sans:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --edge:24px;
  --top:calc(var(--edge) + env(safe-area-inset-top,0px));
  --bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));
  --left:calc(var(--edge) + env(safe-area-inset-left,0px));
  --right:calc(var(--edge) + env(safe-area-inset-right,0px));
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.7,0,.2,1);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}

/* Fond : grille + grain */
.bg{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;background-position:center;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 15%,transparent 78%)}
.grain{position:fixed;left:-50%;top:-50%;width:200%;height:200%;pointer-events:none;z-index:40;opacity:.055;background-image:var(--noise);animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

/* Orbe (logo provisoire) */
.orb{position:relative;width:88px;aspect-ratio:1;border-radius:50%;display:block}
.orb__body{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 22%),
    radial-gradient(circle at 72% 82%,rgba(150,120,255,.55),rgba(0,0,0,0) 46%),
    radial-gradient(circle at 50% 50%,#dfe3ea 0%,#8e96aa 36%,#363c4d 70%,#0c0d12 100%);
  box-shadow:inset -6px -10px 18px rgba(0,0,0,.55),inset 4px 6px 12px rgba(255,255,255,.22),0 12px 30px var(--shadow)}
.orb__body::after{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,rgba(255,80,160,0),rgba(255,80,160,.4),rgba(80,200,255,.4),rgba(170,255,120,.35),rgba(255,80,160,0));mix-blend-mode:overlay;filter:blur(8px);animation:spin 7s linear infinite}
.orb--gate .orb__body{animation:float 5s ease-in-out infinite}
.orb--logo{position:fixed;top:var(--top);left:var(--left);width:52px;z-index:5;opacity:0;pointer-events:none;transition:scale .5s var(--ease-out)}
.orb--logo.is-on{opacity:1;pointer-events:auto}
.orb--logo:hover{scale:1.08}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Écran d'entrée */
.gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center}
.gate > *{animation:rise 1s var(--ease-out) backwards}
.gate > :nth-child(1){animation-name:pop;animation-delay:.1s}
.gate > :nth-child(2){animation-delay:.35s}
.gate > :nth-child(3){animation-delay:.5s}
.gate > :nth-child(4){animation-delay:.8s}
@keyframes rise{from{opacity:0;translate:0 18px;filter:blur(8px)}}
@keyframes pop{from{opacity:0;scale:.6;filter:blur(10px)}}
.gate__line{margin:0;font-size:15px;line-height:1.4;letter-spacing:-.005em}
.gate__fade{transition:opacity .45s var(--ease-out),translate .6s var(--ease-out),filter .45s}
.is-leaving .gate__fade{opacity:0;translate:0 -14px;filter:blur(6px);pointer-events:none}
.is-leaving .gate__fade:nth-of-type(2){transition-delay:.05s}

.enter{position:relative;display:inline-flex;align-items:center;gap:11px;padding:14px 20px 14px 23px;border-radius:999px;background:var(--pill);color:var(--ink);font-size:15px;font-weight:500;line-height:1;letter-spacing:-.005em;overflow:hidden;isolation:isolate;transition:color .35s,scale .25s var(--ease-out);will-change:transform}
.enter::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--pill);pointer-events:none}
.enter__fill{position:absolute;left:var(--x,50%);top:var(--y,50%);width:250%;aspect-ratio:1;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%) scale(0);transition:transform .7s var(--ease-out);z-index:-1}
.enter:hover,.enter:focus-visible{color:var(--fg)}
.enter:hover .enter__fill,.enter:focus-visible .enter__fill{transform:translate(-50%,-50%) scale(1)}
.enter:active{scale:.95}
.enter__label{display:inline-block;white-space:nowrap;will-change:transform}
.enter__dot{position:relative;width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.enter__dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid currentColor;animation:ping 1.9s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(3.4);opacity:0}}
.quiet{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;font-size:12px;color:var(--dim);letter-spacing:.01em;transition:color .3s;white-space:nowrap}
.quiet:hover,.quiet:focus-visible{color:var(--fg)}
.gate > .quiet{animation-name:fade}
@keyframes fade{from{opacity:0}}

/* Interface fixe */
.ui{opacity:0;pointer-events:none;transition:opacity .9s var(--ease-out),translate 1s var(--ease-out)}
.ui--top{translate:0 -10px}
.ui--bottom{translate:0 10px}
.is-entered .ui{opacity:1;translate:0 0;pointer-events:auto;transition-delay:var(--d,0ms)}

.modes{position:fixed;top:calc(var(--top) + 26px);left:50%;transform:translate(-50%,-50%);z-index:5;display:flex;align-items:center;gap:12px;font-size:15px;letter-spacing:-.01em}
.modes button{color:var(--dim);transition:color .3s;padding:6px 2px}
.modes button:hover{color:var(--fg)}
.modes button[aria-selected="true"]{color:var(--fg)}
.modes__dot{width:5px;height:5px;border-radius:50%;background:var(--fg);transition:translate .5s var(--ease-io)}
.modes[data-mode="list"] .modes__dot{translate:3px 0}
.modes[data-mode="spiral"] .modes__dot{translate:-3px 0}

/* Fermeture : le bouton attend que le panneau se soit presque refermé avant de reprendre sa taille et sa couleur */
.menu-btn{position:fixed;top:calc(var(--top) + 4px);right:var(--right);z-index:12;height:44px;display:flex;align-items:center;gap:9px;padding:0 17px 0 19px;border-radius:999px;background:var(--pill);color:var(--ink);font-size:15px;font-weight:500;letter-spacing:-.01em;transition:background .4s var(--ease-io) .38s,color .4s var(--ease-io) .38s,scale .25s var(--ease-out),opacity .9s var(--ease-out) var(--d,0ms),translate 1s var(--ease-out) var(--d,0ms)}
.menu-open .menu-btn{transition-delay:0s,0s,0s,0s,0s}
.menu-btn__labels{display:grid;align-items:center;height:1.3em;overflow:hidden;width:var(--lw,auto);transition:width .45s var(--ease-io) .38s}
.mb-l{grid-area:1/1;justify-self:start;white-space:nowrap;transition:transform .45s var(--ease-io) .38s,opacity .3s .38s}
.mb-l--close{transform:translateY(110%);opacity:0}
.menu-open .mb-l--menu{transform:translateY(-110%);opacity:0}
.menu-open .mb-l--close{transform:none;opacity:1}
.menu-open .menu-btn__labels,.menu-open .mb-l{transition-delay:0s}
.menu-btn:active{scale:.95}
.menu-btn__dot{width:6px;height:6px;border-radius:50%;background:currentColor;transition:scale .5s var(--ease-io)}
.menu-btn:hover .menu-btn__dot{scale:1.5}
.menu-open .menu-btn{background:var(--ink);color:var(--fg)}
.menu-btn:focus-visible{outline-color:var(--fg)}
.menu-open .menu-btn:focus-visible{outline-color:var(--ink)}

.sound{position:fixed;right:var(--right);bottom:var(--bottom);z-index:5;width:46px;height:46px;border-radius:50%;background:var(--pill);color:var(--ink);display:grid;place-items:center;transition:scale .3s var(--ease-out)}
.sound:hover{scale:1.08}
.sound:active{scale:.94}
.bars{display:flex;align-items:center;gap:2.5px;height:16px}
.bars i{display:block;width:2.5px;height:16px;border-radius:2px;background:currentColor;transform-origin:center;animation:eq 1s ease-in-out infinite;transition:transform .4s var(--ease-out)}
.bars i:nth-child(1){animation-duration:.9s}
.bars i:nth-child(2){animation-duration:1.15s;animation-delay:-.4s}
.bars i:nth-child(3){animation-duration:.8s;animation-delay:-.2s}
.bars i:nth-child(4){animation-duration:1.05s;animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.sound.is-muted .bars i{animation:none;transform:scaleY(.16)}

.reel{position:fixed;left:var(--left);bottom:var(--bottom);z-index:5;width:132px;aspect-ratio:1}
.reel__ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite;overflow:visible}
.reel__ring text{fill:var(--fg);font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.02em}
.reel__thumb{position:absolute;inset:29px;border-radius:14px;overflow:hidden;rotate:-12deg;transition:scale .6s var(--ease-out),rotate .6s var(--ease-out);box-shadow:0 10px 26px var(--shadow)}
.reel__thumb::before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,#ffe14a,#ff4fa3,#5b3bff,#18e0c2,#ffe14a);animation:spin 6s linear infinite}
.reel__play{position:absolute;left:50%;top:50%;width:0;height:0;translate:-35% -50%;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent var(--cream);filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.reel:hover .reel__thumb{scale:1.08;rotate:-3deg}

/* Étiquette de survol */
.tag{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:11px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--pill);color:var(--ink);opacity:0;transform:translate(-50%,12px) scale(.96);transition:opacity .3s,transform .5s var(--ease-out);pointer-events:none;max-width:calc(100vw - 2 * var(--edge) - 220px)}
.tag.is-on{opacity:1;transform:translate(-50%,0) scale(1)}
.tag img{width:36px;height:36px;border-radius:999px;object-fit:cover;flex:none}
.tag__text{display:flex;flex-direction:column;gap:2px;min-width:0}
.tag__title{font-size:14px;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag__cat{font-size:11.5px;color:var(--ink-dim);line-height:1.1;white-space:nowrap}

/* Mode liste */
.list{position:fixed;inset:0;z-index:3;overflow-y:auto;scrollbar-width:none;padding-block:20vh 34vh;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));opacity:0;transition:opacity .5s var(--ease-out)}
.list::-webkit-scrollbar{display:none}
.list.is-on{opacity:1}
.list__items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center}
.list__item{color:var(--dim);font-size:clamp(34px,5.6vw,86px);font-weight:500;line-height:1.1;letter-spacing:-.035em;padding:0 .12em;text-align:center;opacity:0;translate:0 30px;transition:color .25s,opacity .7s var(--ease-out),translate .9s var(--ease-out)}
.list.is-on .list__item{opacity:1;translate:0 0;transition-delay:0s,calc(var(--i) * 45ms),calc(var(--i) * 45ms)}
.list__item:hover,.list__item:focus-visible{color:var(--fg)}
.list__item sup{font-size:12px;letter-spacing:.01em;font-weight:400;vertical-align:top;margin-left:.5em;position:relative;top:.9em;color:var(--dim)}
.preview{position:fixed;left:0;top:0;width:min(320px,60vw);border-radius:10px;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;will-change:transform;box-shadow:0 18px 44px var(--shadow)}
.preview.is-portrait{width:min(220px,44vw)}
.preview.is-on{opacity:1}

/* Menu */
.backdrop{position:fixed;inset:0;z-index:8;background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s var(--ease-io)}
.menu-open .backdrop{opacity:1;pointer-events:auto}
.panel{position:fixed;top:calc(var(--top) + 4px);right:var(--right);z-index:11;width:min(390px,calc(100vw - 2 * var(--edge)));max-height:calc(100% - var(--top) - var(--bottom));overflow:auto;background:var(--pill);color:var(--ink);border-radius:24px;padding:84px 28px 24px;display:flex;flex-direction:column;gap:30px;
  clip-path:inset(0 0 calc(100% - var(--bh,44px)) calc(100% - var(--bw,92px)) round 22px);visibility:hidden;transition:clip-path .75s var(--ease-io),visibility 0s .75s}
.menu-open .panel{clip-path:inset(0 0 0 0 round 24px);visibility:visible;transition:clip-path .75s var(--ease-io),visibility 0s}
.panel :focus-visible{outline-color:var(--ink)}
.panel > *{opacity:0;translate:0 16px;transition:opacity .3s,translate .3s}
.menu-open .panel > *{opacity:1;translate:0 0;transition:opacity .6s var(--ease-out),translate .8s var(--ease-out);transition-delay:calc(220ms + var(--i) * 55ms)}
.panel__nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pl{display:flex;align-items:baseline;gap:10px;font-size:46px;font-weight:500;line-height:1.05;letter-spacing:-.04em;transition:translate .5s var(--ease-out),color .3s;text-align:left}
.pl:hover{translate:8px 0}
.pl sup{font-size:12px;letter-spacing:0;font-weight:500;color:var(--ink-dim);position:relative;top:-1.6em}
.pl em{font-style:normal;font-size:11px;letter-spacing:.02em;font-weight:500;color:var(--ink-dim);border:1px solid currentColor;border-radius:999px;padding:3px 8px;align-self:center}
.pl[aria-disabled="true"]{color:var(--ink-dim);cursor:default}
.pl[aria-disabled="true"]:hover{translate:0 0}
.panel__label{margin:0 0 10px;font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.mail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px 13px 16px;border-radius:14px;background:var(--soft);transition:background .4s}
.mail span{font-size:16px;font-weight:500;letter-spacing:-.01em;-webkit-user-select:all;user-select:all;min-width:0;overflow-wrap:anywhere}
.mail button{flex:none;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--pill);transition:scale .25s var(--ease-out)}
.mail button:active{scale:.94}
.flash .mail{animation:flash 1.1s var(--ease-out)}
@keyframes flash{0%{background:var(--soft-strong)}100%{background:var(--soft)}}
.socials{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.socials a{display:inline-flex;gap:6px;font-size:16px;font-weight:500;letter-spacing:-.01em;transition:opacity .25s}
.socials a:hover{opacity:.55}
.socials a span{transition:translate .4s var(--ease-out)}
.socials a:hover span{translate:2px -2px}
.panel__foot{margin:0;display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;padding-top:14px;border-top:1px solid var(--rule)}

.note{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:4;max-width:320px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}

.fx-btn{position:fixed;right:calc(var(--right) + 56px);bottom:calc(var(--bottom) + 1px);z-index:8;height:44px;display:flex;align-items:center;gap:9px;padding:0 17px 0 19px;border-radius:999px;background:var(--pill);color:var(--ink);font-size:15px;font-weight:500;letter-spacing:-.01em;transition:scale .25s var(--ease-out),background .35s var(--ease-io),color .35s var(--ease-io),opacity .9s var(--ease-out) var(--d,0ms),translate 1s var(--ease-out) var(--d,0ms)}
.fx-btn:active{scale:.95}
.fx-btn__icon{display:flex;flex-direction:column;gap:3px;width:12px}
.fx-btn__icon i{display:block;height:1.5px;background:currentColor;border-radius:2px;position:relative}
.fx-btn__icon i::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:currentColor;translate:-50% -50%;left:var(--k);transition:left .5s var(--ease-io)}
.fx-btn:hover .fx-btn__icon i:nth-child(1)::after{left:75%}
.fx-btn:hover .fx-btn__icon i:nth-child(2)::after{left:20%}
.fx-btn:hover .fx-btn__icon i:nth-child(3)::after{left:60%}
.fx-open .fx-btn{background:var(--ink);color:var(--pill);box-shadow:inset 0 0 0 1px var(--pill)}
.fx{position:fixed;right:var(--right);bottom:calc(var(--bottom) + 58px);z-index:7;width:min(300px,calc(100vw - 2 * var(--edge)));background:var(--pill);color:var(--ink);border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;opacity:0;translate:0 12px;scale:.97;transform-origin:bottom right;visibility:hidden;transition:opacity .25s,translate .45s var(--ease-out),scale .45s var(--ease-out),visibility 0s .45s}
.fx-open .fx{opacity:1;translate:0 0;scale:1;visibility:visible;transition:opacity .3s,translate .55s var(--ease-out),scale .55s var(--ease-out),visibility 0s}
.fx :focus-visible{outline-color:var(--ink)}
.fx__head{display:flex;justify-content:space-between;align-items:baseline}
.fx__title,.fx__reset{font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.fx__reset{transition:color .25s}
.fx__reset:hover{color:var(--ink)}
.fx__row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.fx__row label{font-size:14px;font-weight:500;letter-spacing:-.01em}
.fx__val{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.fx__row input{grid-column:1/-1}
.fx input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer}
.fx input[type="range"]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--pct,50%),var(--rule) var(--pct,50%))}
.fx input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--ink);border:0;transition:scale .2s var(--ease-out)}
.fx input[type="range"]:active::-webkit-slider-thumb{scale:1.25}
.fx input[type="range"]::-moz-range-track{height:2px;border-radius:2px;background:var(--rule)}
.fx input[type="range"]::-moz-range-progress{height:2px;border-radius:2px;background:var(--ink)}
.fx input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:0}
.fx__surprise{margin-top:2px;height:42px;border-radius:999px;background:var(--ink);color:var(--pill);font-size:14px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:9px;transition:scale .25s var(--ease-out)}
.fx__surprise:active{scale:.96}
.fx__dice{display:inline-block;width:14px;height:14px;border:1.5px solid currentColor;border-radius:4px;position:relative;transition:rotate .6s var(--ease-io)}
.fx__dice::before,.fx__dice::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor}
.fx__dice::before{left:2px;top:2px}
.fx__dice::after{right:2px;bottom:2px}
.fx__surprise:hover .fx__dice{rotate:180deg}

@media (max-width:640px){
  :root{--edge:16px}
  .orb--logo{width:44px}
  .modes{top:calc(var(--top) + 22px);font-size:14px}
  .menu-btn{top:var(--top);height:40px;padding:0 14px 0 16px;font-size:14px}
  .panel{top:var(--top);padding:74px 22px 22px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
  const damp = (f, dt) => 1 - Math.pow(1 - f, dt * 60);

  const state = { entered: false, sound: true, mode: 'spiral', menu: false };

  /* Sons : branchements prêts, à remplir plus tard */
  const sfx = { play(name) { if (!state.sound) return; /* à venir : ambiance + sons d'interaction */ } };

  /* ---------- Projets (placeholders) ---------- */
  const N = 12;
  const CATS = ['motion design', 'direction artistique', 'montage', 'identité visuelle', 'social media', '3d'];
  const PALETTES = [
    ['#2b2bff', '#00e0c6', '#ffde3b'], ['#ff5e3a', '#ffd1c2', '#2a1a5e'], ['#c8ff2e', '#1a6b4f', '#0f0f2e'],
    ['#ff3ea5', '#5b2bff', '#ffe3f3'], ['#00b3ff', '#002a5c', '#ff9f1c'], ['#f4f0e6', '#ff4b2b', '#1b1b1b'],
    ['#7b5cff', '#ff9bd2', '#14112b'], ['#ffb800', '#ff3d00', '#3a0a00'], ['#00ffa3', '#0047ff', '#e8fff6'],
    ['#e9e2ff', '#6a4cff', '#ff6a3d'], ['#ff2e2e', '#1e0b3a', '#ffd23f'], ['#9be7ff', '#ffffff', '#2c3cff']
  ];
  const PORTRAIT = new Set([3, 8]);
  const projects = Array.from({ length: N }, (_, i) => ({
    title: 'Projet ' + String(i + 1).padStart(2, '0'),
    cat: CATS[i % CATS.length],
    portrait: PORTRAIT.has(i)
  }));

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function makeArt(i, portrait) {
    const w = portrait ? 640 : 1024, h = portrait ? 840 : 640;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const r = rng(i * 7919 + 17);
    const [a, b, k] = PALETTES[i % PALETTES.length];
    const m = Math.min(w, h);

    const lg = g.createLinearGradient(0, 0, w, h);
    lg.addColorStop(0, a); lg.addColorStop(1, b);
    g.fillStyle = lg; g.fillRect(0, 0, w, h);

    g.save();
    const style = i % 4;
    if (style === 0) {
      const cx = w * (0.48 + r() * 0.18), cy = h * (0.46 + r() * 0.12), rad = m * 0.33;
      const rg = g.createRadialGradient(cx - rad * 0.35, cy - rad * 0.35, rad * 0.05, cx, cy, rad);
      rg.addColorStop(0, 'rgba(255,255,255,.9)'); rg.addColorStop(0.3, k); rg.addColorStop(1, b);
      g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill();
      g.strokeStyle = hexA(k, 0.9); g.lineWidth = m * 0.018;
      g.beginPath(); g.ellipse(cx, cy, rad * 1.45, rad * 0.42, -0.4, 0, Math.PI * 2); g.stroke();
    } else if (style === 1) {
      g.translate(w / 2, h / 2); g.rotate(-0.55 + r() * 0.3);
      const band = m * 0.085;
      g.fillStyle = hexA(k, 0.85);
      for (let x = -w * 1.2; x < w * 1.2; x += band * 2) g.fillRect(x, -h * 1.2, band, h * 2.4);
      g.rotate(0.9);
      g.fillStyle = a; g.beginPath(); g.arc(m * 0.05, 0, m * 0.24, 0, Math.PI * 2); g.fill();
      g.fillStyle = b; g.beginPath(); g.arc(m * 0.05, 0, m * 0.11, 0, Math.PI * 2); g.fill();
    } else if (style === 2) {
      const cols = [a, b, k, k, a];
      for (let j = 0; j < 6; j++) {
        const cx = r() * w, cy = r() * h, rad = m * (0.25 + r() * 0.4);
        const rg = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
        const col = cols[j % cols.length];
        rg.addColorStop(0, hexA(col, 0.95)); rg.addColorStop(1, hexA(col, 0));
        g.fillStyle = rg; g.fillRect(0, 0, w, h);
      }
    } else {
      const colsN = portrait ? 4 : 6, cell = w / colsN, rows = Math.ceil(h / cell);
      for (let y = 0; y < rows; y++) for (let x = 0; x < colsN; x++) {
        if (r() > 0.58) continue;
        const px = x * cell, py = y * cell;
        g.fillStyle = r() < 0.5 ? k : a;
        const s = r();
        g.beginPath();
        if (s < 0.33) g.arc(px + cell / 2, py + cell / 2, cell * 0.42, 0, Math.PI * 2);
        else if (s < 0.66) { g.moveTo(px, py + cell); g.arc(px, py + cell, cell * 0.95, -Math.PI / 2, 0); g.closePath(); }
        else { g.moveTo(px + cell * 0.1, py + cell * 0.9); g.lineTo(px + cell * 0.5, py + cell * 0.1); g.lineTo(px + cell * 0.9, py + cell * 0.9); g.closePath(); }
        g.fill();
      }
    }
    g.restore();

    const vg = g.createRadialGradient(w / 2, h / 2, m * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);

    const id = g.getImageData(0, 0, w, h), d = id.data;
    for (let p = 0; p < d.length; p += 4) { const n = (r() - 0.5) * 24; d[p] += n; d[p + 1] += n; d[p + 2] += n; }
    g.putImageData(id, 0, 0);

    g.fillStyle = 'rgba(255,255,255,.94)';
    g.shadowColor = 'rgba(0,0,0,.3)'; g.shadowBlur = 14;
    g.font = `600 ${Math.round(m * 0.17)}px "Helvetica Neue", Arial, sans-serif`;
    g.fillText(String(i + 1).padStart(2, '0'), m * 0.06, h - m * 0.07);
    g.font = `500 ${Math.round(m * 0.038)}px "Helvetica Neue", Arial, sans-serif`;
    g.fillText('image projet — à remplacer', m * 0.065, m * 0.1);
    return c;
  }

  projects.forEach((p, i) => { p.canvas = makeArt(i, p.portrait); p.thumb = p.canvas.toDataURL('image/jpeg', 0.82); });

  /* Grain */
  (() => {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const g = c.getContext('2d'), id = g.createImageData(160, 160);
    for (let p = 0; p < id.data.length; p += 4) { const v = Math.random() * 255; id.data[p] = id.data[p + 1] = id.data[p + 2] = v; id.data[p + 3] = 255; }
    g.putImageData(id, 0, 0);
    document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
  })();


  /* ---------- Scène 3D ---------- */
  const canvas = $('#scene');
  let renderer = null;
  try {
    if (window.THREE) renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { renderer = null; }
  const webgl = !!renderer;

  /* Hélice verticale : les cartes tournent autour d'un axe presque vertical et montent / descendent au scroll, sans fin */
  const PITCH = 0.5;
  /* Réglages : valeurs cibles (curseurs) et valeurs lissées (ce que la spirale affiche) */
  const FX_DEF = { width: 1, twist: 0.75, speed: 1, warp: 1 };
  const fx = { ...FX_DEF }, fxC = { ...FX_DEF };
  const layout = { R: 2.75, cam: 7.6, tx: 0.04, oy: 0, s: 1 };
  let scene, camera, helix, cards = [], ray, ndc;
  let scrollT = -5, scrollC = -5, velS = 0, introStart = -1, modeA = 1, modeT = 1;
  /* Défilement automatique au repos : la spirale descend doucement après 2,2 s sans action */
  let lastInput = performance.now(), idleV = 0;
  const IDLE_SPEED = 0.22, IDLE_DELAY = 2200;
  let mx = 0, my = 0, mxs = 0, mys = 0, px = 0, py = 0, inside = false;
  let hovered = null;

  if (webgl) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    helix = new THREE.Group();
    scene.add(helix);

    const vert = `
      uniform float uHover;
      uniform float uWarp;
      uniform vec2 uSize;
      varying vec2 vUv;
      void main(){
        vUv = uv;
        vec3 p = position;
        vec2 n = p.xy / (uSize * 0.5);
        p.z += uHover * 0.13 * (n.x * n.x * 0.9 + n.y * n.y * 0.35);
        /* Déformation pendant la rotation : les coins partent en arrière, avec un léger vrillage dans le sens du mouvement */
        float w = abs(uWarp);
        p.z -= w * (n.x * n.x * 0.75 + n.y * n.y * 0.35);
        p.z += uWarp * 0.35 * n.x * n.y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;
    const frag = `
      uniform sampler2D uTex;
      uniform float uHover;
      uniform float uOpacity;
      uniform float uShade;
      uniform float uRadius;
      uniform float uBlur;
      uniform vec3 uBg;
      uniform float uSat;
      uniform vec2 uSize;
      varying vec2 vUv;
      void main(){
        vec2 uv = (vUv - 0.5) * (1.0 - uHover * 0.035) + 0.5;
        if (!gl_FrontFacing) uv.x = 1.0 - uv.x;
        vec3 col;
        if (uBlur > 0.02) {
          col = vec3(0.0);
          for (int i = -2; i <= 2; i++) {
            for (int j = -2; j <= 2; j++) {
              col += texture2D(uTex, uv + vec2(float(i), float(j)) * uBlur * 0.007).rgb;
            }
          }
          col /= 25.0;
        } else {
          col = texture2D(uTex, uv).rgb;
        }
        /* Noir et blanc, sauf les cartes de devant qui reprennent leurs couleurs */
        float lum = dot(col, vec3(0.299, 0.587, 0.114));
        col = mix(vec3(lum), col, max(uSat, uHover));
        col = mix(uBg, col, mix(uShade, 1.0, uHover));
        col = col * (1.0 + uHover * 0.12) + uHover * 0.025;
        vec2 halfS = uSize * 0.5;
        vec2 q = abs(vUv - 0.5) * uSize - (halfS - uRadius);
        float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - uRadius;
        float rim = smoothstep(-0.03, 0.0, d);
        col = mix(col, vec3(1.0), rim * uHover * 0.6);
        float diag = vUv.x * 0.8 + (1.0 - vUv.y) * 0.5;
        float sweep = 1.0 - smoothstep(0.0, 0.18, abs(diag - (uHover * 1.6 - 0.25)));
        col += sweep * uHover * 0.10;
        float a = 1.0 - smoothstep(-0.003, 0.003, d);
        float alpha = a * uOpacity;
        if (alpha < 0.002) discard;
        gl_FragColor = vec4(col, alpha);
      }`;

    cards = projects.map((p, i) => {
      const w = p.portrait ? 1.0 : 1.7, h = p.portrait ? 1.32 : 1.06;
      const tex = new THREE.CanvasTexture(p.canvas);
      tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTex: { value: tex }, uHover: { value: 0 }, uOpacity: { value: 0 }, uShade: { value: 1 }, uBlur: { value: 0 }, uWarp: { value: 0 }, uBg: { value: new THREE.Color(0xf8f3e3) }, uSat: { value: 1 },
          uSize: { value: new THREE.Vector2(w, h) }, uRadius: { value: 0.035 }
        },
        vertexShader: vert, fragmentShader: frag, transparent: true, depthWrite: false, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h, 32, 20), mat);
      mesh.userData.index = i;
      helix.add(mesh);
      return { mesh, mat, hover: 0, order: 0, project: p };
    });

    ray = new THREE.Raycaster();
    ndc = new THREE.Vector2();
  }

  function resize() {
    if (!webgl) return;
    const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = aspect;
    Object.assign(layout, aspect < 0.9
      ? { R: 1.55, cam: 10.5, tx: 0.03, oy: 0.1, s: 0.75 }
      : { R: 2.75, cam: 7.6, tx: 0.04, oy: 0, s: 1 });
    camera.position.set(0, 0, layout.cam);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* Position de chaque carte dans la boucle, de -N/2 (en haut) à +N/2 (en bas) */
  const wrapP = (i) => { let p = i - scrollC; p = ((p % N) + N) % N; if (p >= N / 2) p -= N; return p; };

  function pick(x, y) {
    ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(cards.map((c) => c.mesh));
    for (const h of hits) {
      const c = cards[h.object.userData.index];
      if (c.mat.uniforms.uOpacity.value > 0.5 && Math.cos(wrapP(c.mesh.userData.index) * fxC.twist) > 0.2) return c;
    }
    return null;
  }

  const tag = $('#tag'), tagImg = $('#tagImg'), tagTitle = $('#tagTitle'), tagCat = $('#tagCat');
  function setHovered(c) {
    if (c === hovered) return;
    hovered = c;
    canvas.style.cursor = c ? 'pointer' : '';
    if (c) {
      tagImg.src = c.project.thumb;
      tagTitle.textContent = c.project.title;
      tagCat.textContent = c.project.cat;
      tag.classList.add('is-on');
      sfx.play('hover');
    } else tag.classList.remove('is-on');
  }

  /* Aperçu du mode liste */
  const preview = $('#preview');
  let pvx = window.innerWidth / 2, pvy = window.innerHeight / 2, pvtx = pvx, pvty = pvy;

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (webgl) {
      const idleOn = !reduce && state.entered && state.mode === 'spiral' && !state.menu && !hovered && !drag && (now - lastInput > IDLE_DELAY);
      for (const k in fx) fxC[k] += (fx[k] - fxC[k]) * damp(0.06, dt);
      idleV += ((idleOn ? -IDLE_SPEED * fxC.speed : 0) - idleV) * damp(0.025, dt);
      if (Math.abs(idleV) > 0.0005) { scrollT += idleV * dt; clearTimeout(snapTimer); }

      const prevC = scrollC;
      scrollC += (scrollT - scrollC) * damp(0.085, dt);
      const vRaw = dt > 0 ? (scrollC - prevC) / dt : 0;
      velS += (vRaw - velS) * damp(0.15, dt);
      const warp = reduce ? 0 : clamp(velS * 0.09 * fxC.warp, -0.7, 0.7);
      const RR = layout.R * fxC.width;
      modeA += (modeT - modeA) * damp(0.08, dt);
      mxs += (mx - mxs) * damp(0.05, dt);
      mys += (my - mys) * damp(0.05, dt);
      helix.rotation.set(layout.tx + mys * 0.03, mxs * 0.06, 0);
      helix.position.y = layout.oy;

      if (state.entered && inside && state.mode === 'spiral' && !state.menu) setHovered(pick(px, py));

      for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        const p = wrapP(i);
        const th = p * fxC.twist;
        let ia = 0;
        if (introStart >= 0) ia = easeOutExpo(clamp((now - introStart - c.order * 75) / 1400, 0, 1));

        const x = Math.sin(th) * RR;
        const y = -p * PITCH + (1 - ia) * -0.6;
        const z = Math.cos(th) * RR - RR + (1 - ia) * -6 + (1 - modeA) * -3;
        c.mesh.position.set(x, y, z);
        c.mesh.rotation.set(0, th + (1 - ia) * 0.9, 0);

        const target = (hovered === c && state.mode === 'spiral' && !state.menu) ? 1 : 0;
        c.hover += (target - c.hover) * damp(0.12, dt);
        const s = (1 + c.hover * 0.06) * layout.s;
        c.mesh.scale.set(s, s, 1);

        const back = (1 - Math.cos(th)) / 2;
        const edgeF = 1 - smooth(N / 2 - 1.4, N / 2 - 0.2, Math.abs(p));
        c.mat.uniforms.uShade.value = 1 - 0.55 * back;
        /* Flou : cartes du fond + cartes qui s'approchent du haut et du bas de l'écran */
        c.mat.uniforms.uBlur.value = Math.max(smooth(0.25, 0.9, back), smooth(2.2, 4.8, Math.abs(p)) * 0.85);
        c.mat.uniforms.uOpacity.value = edgeF * ia * modeA;
        c.mat.uniforms.uHover.value = c.hover;
        c.mat.uniforms.uWarp.value = warp;
        /* Couleur : pleine pour la carte de face et ses deux voisines, puis disparaît en tournant */
        c.mat.uniforms.uSat.value = smooth(0.2, 0.7, Math.cos(th));
      }
      renderer.render(scene, camera);
    }

    if (state.mode === 'list') {
      listC += (listT - listC) * damp(0.085, dt);
      if (Math.abs(listT - listC) > 0.2) { ownScroll = true; list.scrollTop = listC; }
      pvx += (pvtx - pvx) * damp(0.14, dt);
      pvy += (pvty - pvy) * damp(0.14, dt);
      const rot = clamp((pvtx - pvx) * 0.04, -8, 8);
      preview.style.transform = `translate(${pvx}px, ${pvy}px) translate(-50%, -50%) rotate(${rot}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- Entrées utilisateur ---------- */
  let snapTimer = 0;
  const scheduleSnap = () => { clearTimeout(snapTimer); snapTimer = setTimeout(() => { scrollT = Math.round(scrollT); }, 220); };

  window.addEventListener('wheel', (e) => {
    if (!state.entered || state.menu || state.mode !== 'spiral' || !webgl) return;
    if (e.target.closest && e.target.closest('.fx')) return;
    e.preventDefault();
    /* Molette : haut / bas. Pavé tactile : glisser vers la droite fait descendre la spirale */
    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY);
    let d = horiz ? -e.deltaX : e.deltaY;
    if (e.deltaMode === 1) d *= 33;
    scrollT += clamp(d, -120, 120) * 0.0042 * (0.35 + 0.65 * fx.speed);
    lastInput = performance.now(); idleV = 0;
    scheduleSnap();
  }, { passive: false });

  window.addEventListener('pointermove', (e) => {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
    pvtx = e.clientX; pvty = e.clientY;
  });

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    drag = { x: e.clientX, moved: 0 };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    px = e.clientX; py = e.clientY; inside = true;
    if (drag && state.entered && state.mode === 'spiral') {
      /* Mobile : glisser le doigt vers la droite fait descendre la spirale */
      const dx = e.clientX - drag.x; drag.x = e.clientX; drag.moved += Math.abs(dx);
      scrollT += dx * 0.012; scheduleSnap();
      lastInput = performance.now(); idleV = 0;
    }
  });
  canvas.addEventListener('pointerup', (e) => { if (drag && drag.moved < 8) { px = e.clientX; py = e.clientY; inside = true; } drag = null; });
  canvas.addEventListener('pointerleave', () => { inside = false; if (!drag) setHovered(null); });
  canvas.addEventListener('click', () => { if (hovered) sfx.play('click'); });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.menu) { setMenu(false); return; }
    if (e.key === 'Escape' && state.fx) { setFx(false); fxBtn.focus({ preventScroll: true }); return; }
    if (!state.entered || state.menu || state.mode !== 'spiral') return;
    lastInput = performance.now(); idleV = 0;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') { scrollT = Math.round(scrollT) + 1; e.preventDefault(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { scrollT = Math.round(scrollT) - 1; e.preventDefault(); }
  });

  /* ---------- Écran d'entrée ---------- */
  const gate = $('#gate'), gateOrb = $('#gateOrb'), logo = $('#logo');
  const enterBtn = $('#enterBtn'), enterLabel = $('#enterLabel'), quietBtn = $('#quietBtn');

  enterBtn.addEventListener('pointerenter', (e) => {
    const r = enterBtn.getBoundingClientRect();
    enterBtn.style.setProperty('--x', `${e.clientX - r.left}px`);
    enterBtn.style.setProperty('--y', `${e.clientY - r.top}px`);
    sfx.play('hover');
  });
  enterBtn.addEventListener('pointerleave', (e) => {
    const r = enterBtn.getBoundingClientRect();
    enterBtn.style.setProperty('--x', `${e.clientX - r.left}px`);
    enterBtn.style.setProperty('--y', `${e.clientY - r.top}px`);
  });

  /* Bouton aimanté */
  let mag = { x: 0, y: 0, tx: 0, ty: 0 };
  function magnet(e) {
    if (state.entered || reduce) return;
    const r = enterBtn.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy), radius = 190;
    const f = dist < radius ? (1 - dist / radius) : 0;
    mag.tx = dx * 0.32 * f; mag.ty = dy * 0.42 * f;
  }
  window.addEventListener('pointermove', magnet);
  (function magLoop() {
    if (state.entered) { enterBtn.style.transform = ''; enterLabel.style.transform = ''; return; }
    mag.x += (mag.tx - mag.x) * 0.15; mag.y += (mag.ty - mag.y) * 0.15;
    enterBtn.style.transform = `translate(${mag.x}px, ${mag.y}px)`;
    enterLabel.style.transform = `translate(${mag.x * 0.25}px, ${mag.y * 0.25}px)`;
    requestAnimationFrame(magLoop);
  })();

  function setOrders() { cards.forEach((c, i) => { c.order = Math.abs(wrapP(i)); }); }

  function enter(withSound) {
    if (state.entered) return;
    state.entered = true;
    setSound(withSound);
    sfx.play('enter');
    document.body.classList.add('is-leaving');

    const from = gateOrb.getBoundingClientRect(), to = logo.getBoundingClientRect();
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const s = to.width / from.width;
    const fly = gateOrb.animate(
      [{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px, ${dy}px) scale(${s})` }],
      { duration: reduce ? 1 : 1050, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' }
    );
    fly.onfinish = () => { logo.classList.add('is-on'); gate.hidden = true; };

    setTimeout(() => document.body.classList.add('is-entered'), reduce ? 0 : 500);

    if (webgl) {
      setOrders();
      introStart = performance.now() + (reduce ? 0 : 300);
      lastInput = performance.now();
      scrollT = 0;
    } else {
      setMode('list');
      $('#modes').hidden = true;
    }
  }
  enterBtn.addEventListener('click', () => enter(true));
  quietBtn.addEventListener('click', () => enter(false));

  /* ---------- Son ---------- */
  const soundBtn = $('#soundBtn');
  function setSound(on) {
    state.sound = on;
    soundBtn.classList.toggle('is-muted', !on);
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.setAttribute('aria-label', on ? 'couper le son' : 'activer le son');
  }
  soundBtn.addEventListener('click', () => { setSound(!state.sound); sfx.play('toggle'); });

  /* ---------- Spirale / liste ---------- */
  const modes = $('#modes'), list = $('#list'), listItems = $('#listItems');
  /* Scroll lissé de la liste : la molette et le pavé tactile fixent une cible, la position la rejoint en douceur.
     Le défilement tactile sur mobile reste natif (il a déjà son inertie). */
  let listT = 0, listC = 0, ownScroll = false;
  list.addEventListener('wheel', (e) => {
    e.preventDefault();
    let d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? -e.deltaX : e.deltaY;
    if (e.deltaMode === 1) d *= 33;
    const max = list.scrollHeight - list.clientHeight;
    listT = clamp(listT + d, 0, max);
  }, { passive: false });
  list.addEventListener('scroll', () => {
    if (ownScroll) { ownScroll = false; return; }
    listT = listC = list.scrollTop;
  }, { passive: true });
  projects.forEach((p, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'list__item'; b.style.setProperty('--i', i);
    b.innerHTML = `<span></span><sup></sup>`;
    b.querySelector('span').textContent = p.title;
    b.querySelector('sup').textContent = p.cat;
    const show = () => {
      preview.src = p.thumb;
      preview.classList.toggle('is-portrait', p.portrait);
      preview.classList.add('is-on');
      sfx.play('hover');
    };
    b.addEventListener('pointerenter', show);
    b.addEventListener('focus', () => { const r = b.getBoundingClientRect(); pvtx = r.left + r.width / 2; pvty = r.top + r.height / 2; show(); });
    b.addEventListener('pointerleave', () => preview.classList.remove('is-on'));
    b.addEventListener('blur', () => preview.classList.remove('is-on'));
    li.appendChild(b); listItems.appendChild(li);
  });

  let listHideTimer = 0;
  function setMode(m) {
    if (m === state.mode && !(m === 'list' && list.hidden)) return;
    state.mode = m;
    modes.dataset.mode = m;
    modes.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
    clearTimeout(listHideTimer);
    if (m === 'list') {
      setHovered(null);
      modeT = 0;
      list.hidden = false;
      list.scrollTop = 0; listT = listC = 0;
      requestAnimationFrame(() => requestAnimationFrame(() => list.classList.add('is-on')));
    } else {
      modeT = 1;
      list.classList.remove('is-on');
      preview.classList.remove('is-on');
      listHideTimer = setTimeout(() => { if (state.mode === 'spiral') list.hidden = true; }, 600);
    }
    sfx.play('mode');
  }
  modes.addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
  logo.addEventListener('click', (e) => { e.preventDefault(); setMenu(false); setMode('spiral'); });

  /* ---------- Menu ---------- */
  const menuBtn = $('#menuBtn'), menuLabels = $('#menuLabels'), panel = $('#panel'), backdrop = $('#backdrop');
  const lblMenu = menuLabels.querySelector('.mb-l--menu'), lblClose = menuLabels.querySelector('.mb-l--close');
  /* Largeur du libellé animée entre « menu » et « fermer » ; le panneau se referme exactement sur la taille du bouton */
  function measureMenu() {
    menuLabels.style.setProperty('--lw', `${(state.menu ? lblClose : lblMenu).offsetWidth}px`);
    if (!state.menu) {
      const r = menuBtn.getBoundingClientRect();
      const closedW = r.width - menuLabels.offsetWidth + lblMenu.offsetWidth;
      panel.style.setProperty('--bw', `${closedW}px`);
      panel.style.setProperty('--bh', `${r.height}px`);
    }
  }
  measureMenu();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureMenu);
  window.addEventListener('resize', measureMenu);

  function setMenu(open) {
    if (open === state.menu) return;
    state.menu = open;
    document.body.classList.toggle('menu-open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? 'fermer le menu' : 'ouvrir le menu');
    measureMenu();
    if (open) { setFx(false); setHovered(null); setTimeout(() => panel.querySelector('.pl').focus({ preventScroll: true }), 350); }
    sfx.play(open ? 'open' : 'close');
  }
  menuBtn.addEventListener('click', () => setMenu(!state.menu));
  backdrop.addEventListener('click', () => setMenu(false));

  panel.querySelectorAll('.pl').forEach((b) => {
    b.addEventListener('click', () => {
      const go = b.dataset.go;
      if (go === 'works') { setMenu(false); setMode('spiral'); menuBtn.focus({ preventScroll: true }); }
      if (go === 'contact') {
        const blk = $('#contactBlock');
        blk.classList.remove('flash'); void blk.offsetWidth; blk.classList.add('flash');
        $('#copyBtn').focus({ preventScroll: true });
      }
    });
  });

  const copyBtn = $('#copyBtn'), mailText = $('#mailText');
  function selectMail() {
    const r = document.createRange(); r.selectNodeContents(mailText);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    copyBtn.textContent = 'sélectionné';
    setTimeout(() => { copyBtn.textContent = 'copier'; }, 1800);
  }
  copyBtn.addEventListener('click', () => {
    const done = () => { copyBtn.textContent = 'copié'; setTimeout(() => { copyBtn.textContent = 'copier'; }, 1600); };
    try { navigator.clipboard.writeText(mailText.textContent).then(done, selectMail); } catch (e) { selectMail(); }
  });

  const clock = $('#clock');
  const fmt = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
  const tickClock = () => { clock.textContent = fmt.format(new Date()); };
  tickClock(); setInterval(tickClock, 15000);

  /* ---------- Mise à jour à chaud : garde l'état quand la page est republiée ---------- */
  function instantEnter(data) {
    if (data.fx) { Object.assign(fx, data.fx); Object.assign(fxC, data.fx); syncFx(); }
    state.entered = true;
    setSound(data.sound !== false);
    gate.hidden = true;
    logo.classList.add('is-on');
    document.body.classList.add('is-entered');
    if (webgl) {
      scrollT = scrollC = typeof data.scroll === 'number' ? data.scroll : 0;
      setOrders();
      introStart = performance.now() - 10000;
    }
    if (data.mode === 'list' || !webgl) setMode('list');
  }
  /* ---------- Panneau de réglages ---------- */
  const fxBtn = $('#fxBtn'), fxPanel = $('#fx');
  const fxInputs = [...fxPanel.querySelectorAll('input[type="range"]')];
  const fmt2 = {
    width: (v) => `${Math.round(v * 100)} %`,
    twist: (v) => `${Math.round(v * 180 / Math.PI)}°`,
    speed: (v) => `${v.toFixed(1)}×`,
    warp: (v) => `${Math.round(v * 100)} %`
  };
  function syncFx() {
    fxInputs.forEach((inp) => {
      const k = inp.dataset.k;
      inp.value = fx[k];
      const pct = ((fx[k] - inp.min) / (inp.max - inp.min)) * 100;
      inp.style.setProperty('--pct', `${pct}%`);
      $(`#${inp.id}-v`).textContent = fmt2[k](fx[k]);
    });
  }
  function setFx(open) {
    if (open === !!state.fx) return;
    state.fx = open;
    document.body.classList.toggle('fx-open', open);
    fxBtn.setAttribute('aria-expanded', String(open));
    sfx.play(open ? 'open' : 'close');
  }
  fxBtn.addEventListener('click', () => { if (state.menu) setMenu(false); setFx(!state.fx); });
  fxInputs.forEach((inp) => inp.addEventListener('input', () => { fx[inp.dataset.k] = parseFloat(inp.value); syncFx(); }));
  $('#fxReset').addEventListener('click', () => { Object.assign(fx, FX_DEF); syncFx(); sfx.play('reset'); });
  $('#fxSurprise').addEventListener('click', () => {
    const rnd = (a, b) => a + Math.random() * (b - a);
    let tries = 0, next;
    do {
      next = { width: rnd(0.3, 1.7), twist: rnd(0.12, 1.7), speed: rnd(0.3, 2.6), warp: rnd(0.2, 3) };
      tries++;
    } while (tries < 8 && Math.abs(next.width - fx.width) + Math.abs(next.twist - fx.twist) < 0.6);
    Object.assign(fx, next);
    syncFx();
    scrollT += 1.5; lastInput = performance.now() - IDLE_DELAY;
    sfx.play('surprise');
  });
  syncFx();

  window.claude?.hot?.snapshot?.(() => ({ entered: state.entered, sound: state.sound, mode: state.mode, scroll: scrollT, fx: { ...fx } }));
  const start = (data) => { if (data && data.entered) instantEnter(data); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
